<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<!-- AUTH SECTION -->
<div id="auth-section" class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">TaskFlow</span>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <h2>Connexion</h2>
      <input type="email" id="login-email" placeholder="Email" />
      <input type="password" id="login-password" placeholder="Mot de passe" />
      <button onclick="login()">Se connecter</button>
      <p class="auth-switch">Pas de compte ? <a href="#" onclick="showRegister()">S'inscrire</a></p>
      <p id="login-error" class="error-msg"></p>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none">
      <h2>Créer un compte</h2>
      <input type="text" id="reg-name" placeholder="Nom complet" />
      <input type="email" id="reg-email" placeholder="Email" />
      <input type="password" id="reg-password" placeholder="Mot de passe (min. 6 car.)" />
      <button onclick="register()">S'inscrire</button>
      <p class="auth-switch">Déjà un compte ? <a href="#" onclick="showLogin()">Se connecter</a></p>
      <p id="register-error" class="error-msg"></p>
    </div>
  </div>
</div>

<!-- APP SECTION -->
<div id="app-section" style="display:none">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">TaskFlow</span>
    </div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="showPage('dashboard')">Dashboard</button>
      <button class="nav-btn" onclick="showPage('projects')">Projets</button>
    </div>
    <div class="nav-right">
      <div class="notif-bell" onclick="toggleNotifPanel()">
        🔔
        <span id="notif-badge" class="notif-badge" style="display:none">0</span>
      </div>
      <span id="user-name" class="user-name"></span>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <!-- NOTIFICATION PANEL -->
  <div id="notif-panel" class="notif-panel" style="display:none">
    <div class="notif-header">
      <span>Notifications</span>
      <button onclick="markAllRead()">Tout lire</button>
    </div>
    <div id="notif-list"></div>
  </div>

  <!-- PAGES -->
  <main class="main-content">

    <!-- DASHBOARD PAGE -->
    <div id="page-dashboard" class="page active">
      <h1 class="page-title">Tableau de bord</h1>
      <div class="stats-grid" id="stats-grid"></div>
      <h2 class="section-title">Tâches en cours</h2>
      <div id="inprogress-tasks" class="task-list"></div>
    </div>

    <!-- PROJECTS PAGE -->
    <div id="page-projects" class="page" style="display:none">
      <div class="page-header">
        <h1 class="page-title">Mes Projets</h1>
        <button class="btn-primary" onclick="showModal('project-modal')">+ Nouveau projet</button>
      </div>
      <div id="projects-grid" class="projects-grid"></div>
    </div>

    <!-- PROJECT DETAIL PAGE -->
    <div id="page-project-detail" class="page" style="display:none">
      <div class="page-header">
        <button class="btn-back" onclick="showPage('projects')">← Retour</button>
        <div id="project-detail-header"></div>
      </div>

      <div class="project-detail-layout">
        <!-- TASKS PANEL -->
        <div class="tasks-panel">
          <div class="panel-header">
            <h2>Tâches</h2>
            <button class="btn-primary" onclick="showModal('task-modal')">+ Ajouter</button>
          </div>
          <!-- FILTERS -->
          <div class="filters-bar">
            <input type="text" id="search-tasks" placeholder="🔍 Rechercher..." oninput="filterTasks()" />
            <select id="filter-status" onchange="filterTasks()">
              <option value="">Tous les statuts</option>
              <option value="à faire">À faire</option>
              <option value="en cours">En cours</option>
              <option value="terminé">Terminé</option>
            </select>
            <select id="filter-priority" onchange="filterTasks()">
              <option value="">Toutes priorités</option>
              <option value="haute">Haute</option>
              <option value="moyenne">Moyenne</option>
              <option value="basse">Basse</option>
            </select>
          </div>
          <div id="tasks-list"></div>
          <div id="pagination-controls" class="pagination"></div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
          <!-- MEMBERS -->
          <div class="panel-card">
            <h3>Membres</h3>
            <div id="members-list"></div>
            <div id="invite-section" style="display:none" class="invite-form">
              <input type="email" id="invite-email" placeholder="Email du membre" />
              <button onclick="inviteMember()">Inviter</button>
            </div>
          </div>
          <!-- ACTIVITY FEED -->
          <div class="panel-card">
            <h3>Activités récentes</h3>
            <div id="activity-feed"></div>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- MODALS -->
<!-- Project Modal -->
<div id="project-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="project-modal-title">Nouveau projet</h3>
    <input type="text" id="proj-title" placeholder="Titre du projet" />
    <textarea id="proj-desc" placeholder="Description"></textarea>
    <input type="date" id="proj-deadline" />
    <select id="proj-status">
      <option value="actif">Actif</option>
      <option value="en pause">En pause</option>
      <option value="archivé">Archivé</option>
    </select>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="hideModal('project-modal')">Annuler</button>
      <button class="btn-primary" onclick="saveProject()">Sauvegarder</button>
    </div>
  </div>
</div>

<!-- Task Modal -->
<div id="task-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="task-modal-title">Nouvelle tâche</h3>
    <input type="text" id="task-title" placeholder="Titre de la tâche" oninput="saveDraft()" />
    <textarea id="task-desc" placeholder="Description" oninput="saveDraft()"></textarea>
    <select id="task-priority" onchange="saveDraft()">
      <option value="basse">Priorité basse</option>
      <option value="moyenne">Priorité moyenne</option>
      <option value="haute">Priorité haute</option>
    </select>
    <select id="task-status" onchange="saveDraft()">
      <option value="à faire">À faire</option>
      <option value="en cours">En cours</option>
      <option value="terminé">Terminé</option>
    </select>
    <input type="date" id="task-deadline" oninput="saveDraft()" />
    <select id="task-assigned">
      <option value="">Non assigné</option>
    </select>
    <div id="draft-banner" class="draft-banner" style="display:none">
      📝 Brouillon récupéré.
      <button onclick="restoreDraft()">Restaurer</button>
      <button onclick="clearDraft()">Ignorer</button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="hideModal('task-modal')">Annuler</button>
      <button class="btn-primary" onclick="saveTask()">Sauvegarder</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/projects.js"></script>
<script src="js/tasks.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>
</body>
</html>
  <!-- PAGES -->
  <main class="main-content">

    <!-- PROJECT DETAIL PAGE -->
    <div id="page-project-detail" class="page" style="display:none">
      <div class="page-header">
        <button class="btn-back" onclick="showPage('projects')">← Retour</button>
        <div id="project-detail-header"></div>
      </div>

      <div class="project-detail-layout">
        <!-- TASKS PANEL -->
        <div class="tasks-panel">
          <div class="panel-header">
            <h2>Tâches</h2>
            <button class="btn-primary" onclick="showModal('task-modal')">+ Ajouter</button>
          </div>
    </div>

  </main>
</div>

<!-- MODALS -->


<!-- Task Modal -->
<div id="task-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="task-modal-title">Nouvelle tâche</h3>

    </select>

      <option value="à faire">À faire</option>
      <option value="en cours">En cours</option>
      <option value="terminé">Terminé</option>
    </select>
    <input type="date" id="task-deadline" oninput="saveDraft()" />
    <select id="task-assigned">
      <option value="">Non assigné</option>
    </select>
  </div>
</div>
<script src="js/tasks.js"></script>
</body>
</html>
