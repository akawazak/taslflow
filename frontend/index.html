<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>


<!-- APP SECTION -->
<div id="app-section" style="display:none">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">TaskFlow</span>
    </div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="showPage('dashboard')">Dashboard</button>
      <button class="nav-btn" onclick="showPage('projects')">Projets</button>
    </div>
    <div class="nav-right">
      <div class="notif-bell" onclick="toggleNotifPanel()">
        🔔
        <span id="notif-badge" class="notif-badge" style="display:none">0</span>
      </div>
      <span id="user-name" class="user-name"></span>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </nav>
  <!-- PAGES -->
  <main class="main-content">

    <!-- PROJECT DETAIL PAGE -->
    <div id="page-project-detail" class="page" style="display:none">
      <div class="page-header">
        <button class="btn-back" onclick="showPage('projects')">← Retour</button>
        <div id="project-detail-header"></div>
      </div>

      <div class="project-detail-layout">
        <!-- TASKS PANEL -->
        <div class="tasks-panel">
          <div class="panel-header">
            <h2>Tâches</h2>
            <button class="btn-primary" onclick="showModal('task-modal')">+ Ajouter</button>
          </div>
    </div>

  </main>
</div>

<!-- MODALS -->


<!-- Task Modal -->
<div id="task-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="task-modal-title">Nouvelle tâche</h3>
    <input type="text" id="task-title" placeholder="Titre de la tâche" oninput="saveDraft()" />
    <textarea id="task-desc" placeholder="Description" oninput="saveDraft()"></textarea>
    <select id="task-priority" onchange="saveDraft()">
      <option value="basse">Priorité basse</option>
      <option value="moyenne">Priorité moyenne</option>
      <option value="haute">Priorité haute</option>
    </select>
    <select id="task-status" onchange="saveDraft()">
      <option value="à faire">À faire</option>
      <option value="en cours">En cours</option>
      <option value="terminé">Terminé</option>
    </select>
    <input type="date" id="task-deadline" oninput="saveDraft()" />
    <select id="task-assigned">
      <option value="">Non assigné</option>
    </select>
  </div>
</div>
<script src="js/tasks.js"></script>
</body>
</html>
