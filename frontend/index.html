<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Authentification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-text">TaskFlow</span>
      </div>

      <div id="login-form">
        <h1>Connexion</h1>
        <p class="subtitle">Connectez-vous pour acceder a votre espace.</p>
        <input type="email" id="login-email" placeholder="Email" />
        <input type="password" id="login-password" placeholder="Mot de passe" />
        <button onclick="login()">Se connecter</button>
        <p class="switch-text">Pas encore de compte ? <a href="#" onclick="showRegister(); return false;">S'inscrire</a></p>
        <p id="login-error" class="error-msg"></p>
      </div>

      <div id="register-form" style="display:none">
        <h1>Inscription</h1>
        <p class="subtitle">Creez un compte pour commencer.</p>
        <input type="text" id="reg-name" placeholder="Nom complet" />
        <input type="email" id="reg-email" placeholder="Email" />
        <input type="password" id="reg-password" placeholder="Mot de passe" />
        <button onclick="register()">Creer mon compte</button>
        <p class="switch-text">Deja un compte ? <a href="#" onclick="showLogin(); return false;">Se connecter</a></p>
        <p id="register-error" class="error-msg"></p>
      </div>

      <div id="session-view" style="display:none">
        <h1>Bienvenue</h1>
        <p class="subtitle">Votre session est active.</p>
        <p id="session-user" class="session-user"></p>
        <button onclick="logout()">Deconnexion</button>
      </div>
    </section>
  </main>

  <script src="js/token.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
